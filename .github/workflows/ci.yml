name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, types, tests, build, size)
    runs-on: ubuntu-latest
    env:
      # Placeholders, so the build includes the sign-in code and the size check is realistic.
      PUBLIC_SUPABASE_URL: https://example.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle

  db:
    name: Database (migrations and access rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
